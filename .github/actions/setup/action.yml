name: Set up MovieFinder
description: Install the pinned application toolchain and locked dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22.22.3
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - uses: ariga/setup-atlas@v0
    - run: bun install --frozen-lockfile
      shell: bash
